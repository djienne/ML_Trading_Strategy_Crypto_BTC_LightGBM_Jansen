networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.99.0/24

services:
  freqtrade:
    build:
      context: .
      dockerfile: Dockerfile.freqtrade
    restart: unless-stopped
    container_name: lgbm_trader
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./shared:/freqtrade/shared
      - ../src:/freqtrade/src:ro
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      -v
      --strategy LightGBMStrategy

  retrainer:
    build:
      context: .
      dockerfile: Dockerfile.retrainer
    restart: unless-stopped
    container_name: lgbm_retrainer
    volumes:
      - ./shared:/app/shared
      - ../src:/app/src:ro
      - ../download_data.py:/app/download_data.py:ro
      # retrain.py is also baked into the image (see Dockerfile.retrainer) so the
      # image runs standalone, but mounting it means code changes only need a
      # `docker compose restart retrainer`, not a rebuild.
      - ./retrainer/retrain.py:/app/retrain.py:ro
      - ../data/feather:/app/shared/data/feather
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f='/app/shared/models/latest_model.txt.tmp'; sys.exit(1 if os.path.exists(f) and time.time()-os.path.getmtime(f)>1800 else 0)\""]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 600s
    command: python /app/retrain.py
